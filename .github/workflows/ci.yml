name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        # the MCP password store differs per OS (DPAPI, Keychain, Secret Service)
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # build.mjs bundles and runs tsc (strict) for the type declarations, so this is the type check too
      - run: npm run build
      - run: npm test
      # On failure, rerun with TAP and turn each failing test into an annotation, so the reason is
      # readable from the run page without downloading logs.
      - if: failure()
        run: node -e "const r=require('child_process').spawnSync(process.execPath,['--test','--test-reporter=tap'],{encoding:'utf8'});const o=r.stdout||'';const b=o.split(/
(?=\s*(?:not )?ok \d)/).filter(x=>/^\s*not ok/.test(x));for(const x of b)console.log('::error::'+x.slice(0,3000).replace(/%/g,'%25').replace(/?
/g,'%0A'))"
      # The shipped tarball is built from this repo: print its checksum so anyone can compare it with
      # https://wafermap.xyz/cli/wafermap-<version>.tgz
      - run: npm pack --silent
      - run: node -e "const f=require('fs').readdirSync('.').find(x=>/^wafermap-.*\.tgz$/.test(x));console.log(require('crypto').createHash('sha256').update(require('fs').readFileSync(f)).digest('hex'),f)"
