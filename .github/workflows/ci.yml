name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # build.mjs bundles and runs tsc (strict) for the type declarations, so this is the type check too
      - run: npm run build
      - run: npm test
      # The shipped tarball is built from this repo: print its checksum so anyone can compare it with
      # https://wafermap.xyz/cli/wafermap-<version>.tgz
      - run: npm pack --silent && sha256sum wafermap-*.tgz
